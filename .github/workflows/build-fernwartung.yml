# Baut Schnellhilfe + Vollversion (Windows/macOS). Bei jeder Aenderung entsteht
# automatisch eine NEUE, fortlaufend nummerierte Version (1, 2, 3 …) unter
# "Releases". Alte Versionen bleiben dauerhaft erhalten und werden nie
# ueberschrieben. Zusaetzlich zeigt das Release "Neueste Version" immer den
# aktuellsten Build, damit die festen Download-Links gleich bleiben:
#   https://github.com/AlexReviewit/Fernwartung-Agent/releases/latest/download/AlexReviewit-Schnellhilfe.exe
#   https://github.com/AlexReviewit/Fernwartung-Agent/releases/latest/download/AlexReviewit-Fernwartung-Setup.exe
#   https://github.com/AlexReviewit/Fernwartung-Agent/releases/latest/download/AlexReviewit-Schnellhilfe.pkg
#   https://github.com/AlexReviewit/Fernwartung-Agent/releases/latest/download/AlexReviewit-Fernwartung.pkg
name: Build Fernwartung
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['remote-agent/**', '.github/workflows/build-fernwartung.yml']
permissions:
  contents: write
jobs:
  # 1) Naechste fortlaufende Versionsnummer bestimmen (hoechste vorhandene + 1).
  prep:
    runs-on: ubuntu-latest
    outputs:
      num: ${{ steps.n.outputs.next }}
    steps:
      - id: n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAX=$(gh api repos/${{ github.repository }}/releases --paginate \
            --jq '[.[].tag_name|select(test("^v[0-9]+$"))|ltrimstr("v")|tonumber]|max // 0')
          echo "next=$((MAX+1))" >> "$GITHUB_OUTPUT"
          echo "Naechste Version: v$((MAX+1))"
  windows:
    needs: prep
    runs-on: windows-latest
    defaults: { run: { working-directory: remote-agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Versionsnummer ins Programm schreiben
        shell: bash
        run: echo -n "${{ needs.prep.outputs.num }}" > build.txt
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --noconsole --version-file version.txt --add-data "assets;assets" --add-data "build.txt;." --collect-all aiortc --collect-all av --collect-all aioice --collect-all pylibsrtp --collect-all cryptography --collect-all cffi --collect-all mss --collect-all numpy --collect-all pyee --collect-all google_crc32c --collect-submodules pynput --icon assets/icon.ico --name "AlexReviewit-Schnellhilfe" schnellhilfe.py
      - run: pyinstaller --noconfirm --clean --onefile --noconsole --version-file version.txt --add-data "assets;assets" --add-data "build.txt;." --collect-all aiortc --collect-all av --collect-all aioice --collect-all pylibsrtp --collect-all cryptography --collect-all cffi --collect-all mss --collect-all numpy --collect-all pyee --collect-all google_crc32c --collect-submodules pynput --icon assets/icon.ico --name "AlexReviewit-Fernwartung" vollversion.py
      - name: Installer der Vollversion bauen (Inno Setup, wie bei Firefox)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "Fernwartung.iss" "/DMyVersion=${{ needs.prep.outputs.num }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: |
            remote-agent/dist/AlexReviewit-Schnellhilfe.exe
            remote-agent/dist/AlexReviewit-Fernwartung-Setup.exe
  macos:
    needs: prep
    runs-on: macos-latest
    defaults: { run: { working-directory: remote-agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Versionsnummer ins Programm schreiben
        shell: bash
        run: echo -n "${{ needs.prep.outputs.num }}" > build.txt
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --icon assets/icon.icns --add-data "assets:assets" --add-data "build.txt:." --collect-all aiortc --collect-all av --collect-all aioice --collect-all pylibsrtp --collect-all cryptography --collect-all cffi --collect-all mss --collect-all numpy --collect-all pyee --collect-all google_crc32c --collect-submodules pynput --osx-bundle-identifier at.alexreviewit.fernwartung.quick --name "AlexReviewit-Schnellhilfe" schnellhilfe.py
      - run: pyinstaller --noconfirm --clean --windowed --icon assets/icon.icns --add-data "assets:assets" --add-data "build.txt:." --collect-all aiortc --collect-all av --collect-all aioice --collect-all pylibsrtp --collect-all cryptography --collect-all cffi --collect-all mss --collect-all numpy --collect-all pyee --collect-all google_crc32c --collect-submodules pynput --osx-bundle-identifier at.alexreviewit.fernwartung --name "AlexReviewit-Fernwartung" vollversion.py
      - run: |
          pkgbuild --install-location /Applications --component "dist/AlexReviewit-Schnellhilfe.app" "dist/AlexReviewit-Schnellhilfe.pkg"
          pkgbuild --install-location /Applications --component "dist/AlexReviewit-Fernwartung.app" "dist/AlexReviewit-Fernwartung.pkg"
      - uses: actions/upload-artifact@v4
        with: { name: macOS, path: 'remote-agent/dist/*.pkg' }
  release:
    needs: [prep, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NUM: ${{ needs.prep.outputs.num }}
    steps:
      # Voller Verlauf + Tags, damit wir die Aenderungen seit der letzten Version lesen koennen.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: version.json fuer das automatische Update erzeugen
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open('remote-agent/version.json'))
          d['version'] = os.environ['NUM']
          json.dump(d, open('out/version.json', 'w'), ensure_ascii=False, indent=2)
          print('version.json ->', d)
          PY
      # NEU: Release-Text aus den echten Aenderungen seit der letzten Version bauen.
      - name: Changelog der Aenderungen erzeugen
        env:
          REPO: ${{ github.repository }}
        run: |
          PREV=$((NUM-1))
          if git rev-parse "v$PREV" >/dev/null 2>&1; then
            RANGE="v$PREV..HEAD"
            COMPARE="https://github.com/$REPO/compare/v$PREV...v$NUM"
          else
            RANGE="HEAD"
            COMPARE="https://github.com/$REPO/commits/v$NUM"
          fi
          # Aenderungen am Fernwartungs-Programm (ohne Merge-Commits). Fallback: alle Aenderungen.
          CHANGES=$(git log --no-merges --pretty='- %s' $RANGE -- remote-agent 2>/dev/null)
          [ -z "$CHANGES" ] && CHANGES=$(git log --no-merges --pretty='- %s' $RANGE 2>/dev/null)
          [ -z "$CHANGES" ] && CHANGES="- Kleinere Verbesserungen und Fehlerbehebungen"

          # Text fuer die nummerierte Version (bleibt dauerhaft erhalten)
          {
            echo "Fernwartung **Version $NUM** – Schnellhilfe (QuickSupport) und Vollversion (Host) fuer Windows und macOS."
            echo ""
            echo "### 🔄 Was ist neu"
            echo "$CHANGES"
            echo ""
            echo "**Full Changelog:** $COMPARE"
            echo ""
            echo "---"
            echo "👉 Zum Herunterladen am besten die **[⭐ Neueste Version](https://github.com/$REPO/releases/latest)** nutzen – die Vollversion aktualisiert sich dann auch selbst."
          } > notes-version.md

          # Text fuer "Neueste Version" (feste Download-Links + was neu ist)
          {
            echo "Diese Seite zeigt **immer den aktuellsten Build** (derzeit **Version $NUM**)."
            echo "Die Download-Links hier bleiben gleich – praktisch fuer die Knoepfe im Intranet."
            echo ""
            echo "### ⬇️ Download"
            echo "| | Windows | macOS |"
            echo "|---|---|---|"
            echo "| ⚡ Schnellhilfe | [.exe](https://github.com/$REPO/releases/latest/download/AlexReviewit-Schnellhilfe.exe) | [.pkg](https://github.com/$REPO/releases/latest/download/AlexReviewit-Schnellhilfe.pkg) |"
            echo "| 💻 Vollversion | [Installer](https://github.com/$REPO/releases/latest/download/AlexReviewit-Fernwartung-Setup.exe) | [Installer](https://github.com/$REPO/releases/latest/download/AlexReviewit-Fernwartung.pkg) |"
            echo ""
            echo "### 🔄 Was ist neu in Version $NUM"
            echo "$CHANGES"
            echo ""
            echo "**Full Changelog:** $COMPARE"
            echo ""
            echo "🔒 Ende-zu-Ende verschluesselt · Zugriff nur mit Zustimmung · jede Sitzung wird protokolliert."
          } > notes-latest.md

          echo "----- notes-version.md -----"; cat notes-version.md
      - name: Neueste Version veroeffentlichen (feste Download-Links)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ⭐ Neueste Version
          body_path: notes-latest.md
          make_latest: true
          files: out/**/*
      - name: Neue nummerierte Version veroeffentlichen (bleibt dauerhaft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NUM }}
          name: Version ${{ env.NUM }}
          make_latest: false
          body_path: notes-version.md
          files: out/**/*
