# Baut Schnellhilfe + Vollversion (Windows/macOS). Bei jeder Aenderung entsteht
# automatisch eine NEUE, fortlaufend nummerierte Version (1, 2, 3 …) unter
# "Releases". Alte Versionen bleiben dauerhaft erhalten und werden nie
# ueberschrieben. Zusaetzlich zeigt das Release "Neueste Version" immer den
# aktuellsten Build, damit die festen Download-Links gleich bleiben:
#   https://github.com/AlexanderEdler/Fernwartung-Agent/releases/latest/download/AlexReviewit-Schnellhilfe.exe
#   https://github.com/AlexanderEdler/Fernwartung-Agent/releases/latest/download/AlexReviewit-Fernwartung.exe
#   https://github.com/AlexanderEdler/Fernwartung-Agent/releases/latest/download/AlexReviewit-Schnellhilfe.pkg
#   https://github.com/AlexanderEdler/Fernwartung-Agent/releases/latest/download/AlexReviewit-Fernwartung.pkg
name: Build Fernwartung
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['remote-agent/**', '.github/workflows/build-fernwartung.yml']
permissions:
  contents: write
jobs:
  # 1) Naechste fortlaufende Versionsnummer bestimmen (hoechste vorhandene + 1).
  prep:
    runs-on: ubuntu-latest
    outputs:
      num: ${{ steps.n.outputs.next }}
    steps:
      - id: n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAX=$(gh api repos/${{ github.repository }}/releases --paginate \
            --jq '[.[].tag_name|select(test("^v[0-9]+$"))|ltrimstr("v")|tonumber]|max // 0')
          echo "next=$((MAX+1))" >> "$GITHUB_OUTPUT"
          echo "Naechste Version: v$((MAX+1))"
  windows:
    needs: prep
    runs-on: windows-latest
    defaults: { run: { working-directory: remote-agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Versionsnummer ins Programm schreiben
        shell: bash
        run: echo -n "${{ needs.prep.outputs.num }}" > build.txt
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --noconsole --version-file version.txt --add-data "assets;assets" --add-data "build.txt;." --collect-all aiortc --collect-all av --collect-all aioice --collect-all pylibsrtp --collect-submodules pynput --icon assets/icon.ico --name "AlexReviewit-Schnellhilfe" schnellhilfe.py
      - run: pyinstaller --noconfirm --clean --onefile --noconsole --version-file version.txt --add-data "assets;assets" --add-data "build.txt;." --collect-all aiortc --collect-all av --collect-all aioice --collect-all pylibsrtp --collect-submodules pynput --icon assets/icon.ico --name "AlexReviewit-Fernwartung" vollversion.py
      - uses: actions/upload-artifact@v4
        with: { name: Windows, path: 'remote-agent/dist/*.exe' }
  macos:
    needs: prep
    runs-on: macos-latest
    defaults: { run: { working-directory: remote-agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Versionsnummer ins Programm schreiben
        shell: bash
        run: echo -n "${{ needs.prep.outputs.num }}" > build.txt
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --icon assets/icon.icns --add-data "assets:assets" --add-data "build.txt:." --collect-all aiortc --collect-all av --collect-all aioice --collect-all pylibsrtp --collect-submodules pynput --osx-bundle-identifier at.alexreviewit.fernwartung.quick --name "AlexReviewit-Schnellhilfe" schnellhilfe.py
      - run: pyinstaller --noconfirm --clean --windowed --icon assets/icon.icns --add-data "assets:assets" --add-data "build.txt:." --collect-all aiortc --collect-all av --collect-all aioice --collect-all pylibsrtp --collect-submodules pynput --osx-bundle-identifier at.alexreviewit.fernwartung --name "AlexReviewit-Fernwartung" vollversion.py
      - run: |
          pkgbuild --install-location /Applications --component "dist/AlexReviewit-Schnellhilfe.app" "dist/AlexReviewit-Schnellhilfe.pkg"
          pkgbuild --install-location /Applications --component "dist/AlexReviewit-Fernwartung.app" "dist/AlexReviewit-Fernwartung.pkg"
      - uses: actions/upload-artifact@v4
        with: { name: macOS, path: 'remote-agent/dist/*.pkg' }
  release:
    needs: [prep, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NUM: ${{ needs.prep.outputs.num }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: version.json fuer das automatische Update erzeugen
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open('remote-agent/version.json'))
          d['version'] = os.environ['NUM']
          json.dump(d, open('out/version.json', 'w'), ensure_ascii=False, indent=2)
          print('version.json ->', d)
          PY
      - name: Neueste Version veroeffentlichen (feste Download-Links)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neueste Version
          body: |
            Automatisch gebaut – aktuell Version ${{ env.NUM }}.
            Schnellhilfe (QuickSupport) + Vollversion (Host) fuer Windows und macOS.

            Feste Download-Links (zeigen immer die neueste Version):
            - Windows Schnellhilfe: /releases/latest/download/AlexReviewit-Schnellhilfe.exe
            - Windows Vollversion:  /releases/latest/download/AlexReviewit-Fernwartung.exe
            - macOS Schnellhilfe:   /releases/latest/download/AlexReviewit-Schnellhilfe.pkg
            - macOS Vollversion:    /releases/latest/download/AlexReviewit-Fernwartung.pkg
          make_latest: true
          files: out/**/*
      - name: Neue nummerierte Version veroeffentlichen (bleibt dauerhaft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NUM }}
          name: Version ${{ env.NUM }}
          make_latest: false
          body: |
            **Version ${{ env.NUM }}**

            Enthaelt Schnellhilfe (QuickSupport) und Vollversion (Host) fuer Windows und macOS.
            Die Vollversion erkennt neue Versionen selbst und verlinkt auf die neueste.
          files: out/**/*
